      .muscle {
        fill: #CCCCCC;
        fill-opacity: 1;
        stroke: white;
        stroke-opacity: 1;
        stroke-width: 0.5;
        pointer-events: all;
        cursor: pointer;
      }
      /* visible silhouette but does not receive pointer events so it won't block selection */
      .silhouette {
        fill: #CCCCCC;
        stroke: white;
        stroke-width: 0.5;
        pointer-events: none;
      }
    </style>
